# Steam Deck Hardware Profile for Hyprland
# Rotates the internal native portrait panel to standard landscape orientation.
# Jupiter (LCD): 1280x800 @ 60Hz, rotated 270 deg (transform 3)
# Galileo (OLED): 1280x800 @ 90Hz, rotated 90 deg (transform 1)
# Auto-fallback to transform 3:

monitor = eDP-1, 1280x800@60, 0x0, 1, transform, 3

input {
    touchdevice {
        transform = 3
        output = eDP-1
    }
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
    }
}

# Power button handling
bindl = , XF86PowerOff, exec, hype ipc call lock lock

# Quick access menu / Anvil console launcher toggles
bind = , XF86Shop, exec, hype ipc call launcher toggle
bind = SUPER, SPACE, exec, hype ipc call launcher toggle
# Steam button / guide button -> Open Anvil Console
bind = , XF86Search, exec, hype ipc call anvil toggle
bind = SUPER ALT, A, exec, hype ipc call anvil toggle
